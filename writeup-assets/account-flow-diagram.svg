<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f3eb"/>
      <stop offset="0.5" stop-color="#f5f8f3"/>
      <stop offset="1" stop-color="#edf5f8"/>
    </linearGradient>
    <filter id="cardShadow" x="78" y="124" width="1444" height="770" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#7b8d87" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#315a54"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#a04d19"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <g filter="url(#cardShadow)">
    <rect x="100" y="145" width="1400" height="730" rx="30" fill="#fffdf9"/>
    <rect x="100.75" y="145.75" width="1398.5" height="728.5" rx="29.25" stroke="#dce4df" stroke-width="1.5"/>
  </g>

  <text x="140" y="220" fill="#13201c" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">SmartLife account surface: two PoC paths, one account-impact chain</text>
  <text x="142" y="264" fill="#5c6b66" font-family="Segoe UI, Arial, sans-serif" font-size="24">Public-client runtime path on the left, account-state impact chain on the right.</text>

  <rect x="150" y="330" width="500" height="440" rx="26" fill="#f7fbfa"/>
  <rect x="150.75" y="330.75" width="498.5" height="438.5" rx="25.25" stroke="#d7e7e2" stroke-width="1.5"/>
  <text x="185" y="390" fill="#1c5a51" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.6">POC PATH A</text>
  <text x="185" y="432" fill="#14201c" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">Direct replay</text>
  <text x="185" y="472" fill="#4f5e59" font-family="Segoe UI, Arial, sans-serif" font-size="23">Recovered or reconstructed SmartLife application context</text>

  <rect x="185" y="518" width="430" height="86" rx="18" fill="#ffffff"/>
  <rect x="185.75" y="518.75" width="428.5" height="84.5" rx="17.25" stroke="#dbe3df" stroke-width="1.5"/>
  <text x="216" y="553" fill="#61716c" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">INPUT</text>
  <text x="216" y="586" fill="#172723" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">App-auth context accepted by the account API</text>

  <rect x="185" y="628" width="430" height="108" rx="18" fill="#ffffff"/>
  <rect x="185.75" y="628.75" width="428.5" height="106.5" rx="17.25" stroke="#dbe3df" stroke-width="1.5"/>
  <text x="216" y="663" fill="#61716c" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">OUTPUT</text>
  <text x="216" y="696" fill="#172723" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Clean request/response proof</text>
  <text x="216" y="726" fill="#4f5e59" font-family="Segoe UI, Arial, sans-serif" font-size="20">verification, signup, reset, login postconditions</text>

  <rect x="720" y="330" width="340" height="440" rx="26" fill="#fff8f0"/>
  <rect x="720.75" y="330.75" width="338.5" height="438.5" rx="25.25" stroke="#ead7c6" stroke-width="1.5"/>
  <text x="755" y="390" fill="#8b4e1f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.6">POC PATH B</text>
  <text x="755" y="432" fill="#2a1c12" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">Frida runtime</text>
  <text x="755" y="472" fill="#6b5a4d" font-family="Segoe UI, Arial, sans-serif" font-size="23">Observe the public client in-process</text>

  <rect x="755" y="518" width="270" height="86" rx="18" fill="#ffffff"/>
  <rect x="755.75" y="518.75" width="268.5" height="84.5" rx="17.25" stroke="#eadfce" stroke-width="1.5"/>
  <text x="785" y="553" fill="#7d6a5a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">INPUT</text>
  <text x="785" y="586" fill="#2a1c12" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Official Android app</text>

  <rect x="755" y="628" width="270" height="108" rx="18" fill="#ffffff"/>
  <rect x="755.75" y="628.75" width="268.5" height="106.5" rx="17.25" stroke="#eadfce" stroke-width="1.5"/>
  <text x="785" y="663" fill="#7d6a5a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">OUTPUT</text>
  <text x="785" y="696" fill="#2a1c12" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Runtime-selected backend</text>
  <text x="785" y="726" fill="#6b5a4d" font-family="Segoe UI, Arial, sans-serif" font-size="20">plus live header-generation evidence</text>

  <rect x="1120" y="250" width="300" height="610" rx="26" fill="#f4f8f7"/>
  <rect x="1120.75" y="250.75" width="298.5" height="608.5" rx="25.25" stroke="#d8e5e1" stroke-width="1.5"/>
  <text x="1155" y="310" fill="#315a54" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.6">ACCOUNT-IMPACT CHAIN</text>

  <rect x="1155" y="350" width="230" height="84" rx="18" fill="#ffffff"/>
  <rect x="1155.75" y="350.75" width="228.5" height="82.5" rx="17.25" stroke="#d8e3df" stroke-width="1.5"/>
  <text x="1184" y="382" fill="#6b7772" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">STEP 1</text>
  <text x="1184" y="414" fill="#15231f" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Verify identity</text>

  <rect x="1155" y="465" width="230" height="84" rx="18" fill="#ffffff"/>
  <rect x="1155.75" y="465.75" width="228.5" height="82.5" rx="17.25" stroke="#d8e3df" stroke-width="1.5"/>
  <text x="1184" y="497" fill="#6b7772" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">STEP 2</text>
  <text x="1184" y="529" fill="#15231f" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Recover accountId</text>

  <rect x="1155" y="580" width="230" height="84" rx="18" fill="#ffffff"/>
  <rect x="1155.75" y="580.75" width="228.5" height="82.5" rx="17.25" stroke="#d8e3df" stroke-width="1.5"/>
  <text x="1184" y="612" fill="#6b7772" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">STEP 3</text>
  <text x="1184" y="644" fill="#15231f" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Reset password</text>

  <rect x="1155" y="695" width="230" height="84" rx="18" fill="#ffffff"/>
  <rect x="1155.75" y="695.75" width="228.5" height="82.5" rx="17.25" stroke="#d8e3df" stroke-width="1.5"/>
  <text x="1184" y="727" fill="#6b7772" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">STEP 4</text>
  <text x="1184" y="759" fill="#15231f" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Log in with new password</text>

  <path d="M615 560C674 560 690 560 742 560" stroke="#315a54" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1025 560C1071 560 1080 560 1115 560" stroke="#a04d19" stroke-width="5" stroke-linecap="round" marker-end="url(#orangeArrow)"/>
  <path d="M1270 434V456" stroke="#315a54" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1270 549V571" stroke="#315a54" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1270 664V686" stroke="#315a54" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
